[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipx"
version = "2.0.0"
description = "VASP-like CLI/TUI interface for MLIP models (UMA, MACE, DPA, GRACE)"
requires-python = ">=3.10, <3.13"
dependencies = [
    "ase>=3.26.0",
    "numpy",
    "tqdm",
    "textual>=0.40.0",
]

[project.optional-dependencies]
# NOTE: MACE/DPA/GRACE engine backends (mace-torch, deepmd-kit,
# tensorpotential) are intentionally NOT declared as installable extras here.
# mace-torch pins e3nn==0.4.4 which conflicts with fairchem-core (e3nn>=0.5),
# so they cannot coexist in a single environment. Install the backend you
# need manually (see `mlipx doctor`), e.g.: pip install mace-torch.
uma = ["fairchem-core"]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
mlipx = "mlipx.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"

# GPU compatibility - run `uv run mlipx setup` (uses nvidia-smi, works
# before torch is installed) to detect your GPU and get the exact torch command.
# Support floor: Maxwell (GTX 900 series, sm_50/52). Kepler (GTX 700/600) not
# supported (no prebuilt PyTorch wheel).
#   Maxwell/Pascal (sm_50/52/60/61) + Volta~Hopper (sm_70~90):
#     uv pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
#     (torch 2.7+ dropped sm_50/sm_60; sm_50/sm_60 kernels binary-compat with sm_52/sm_61)
#   Blackwell (RTX 50, sm_100/120):
#     uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
#   or build from source: TORCH_CUDA_ARCH_LIST="6.0;6.1" python setup.py develop
