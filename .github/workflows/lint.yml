name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv pip install --python 3.12 ruff
      - name: Ruff check
        run: uv run ruff check mlipx/mlipx tests scripts
      - name: Ruff format check
        run: uv run ruff format --check mlipx/mlipx tests scripts
