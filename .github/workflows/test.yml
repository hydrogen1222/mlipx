name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mlipx dev dependencies
        run: |
          uv venv .venv-dev --python ${{ matrix.python-version }}
          uv pip install --python .venv-dev/bin/python -e './mlipx[dev]'
      - name: Run tests
        run: |
          uv run --python .venv-dev/bin/python pytest tests -q

  analysis-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install all analysis backends
        run: |
          uv venv .venv-analysis --python 3.12
          uv pip install --python .venv-analysis/bin/python -e './mlipx[dev,analysis-all]'
      - name: Verify supported backend majors
        run: |
          uv run --python .venv-analysis/bin/python python -c "import gemdat, kinisi; assert gemdat.__version__.startswith('1.'); assert kinisi.__version__.startswith('2.')"
      - name: Run real kinisi and GEMDAT integration tests
        run: |
          uv run --python .venv-analysis/bin/python pytest tests/mlipx/mlipx/analysis/test_analysis_backends_integration.py -q
