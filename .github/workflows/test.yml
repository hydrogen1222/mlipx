name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mlipx dev dependencies
        run: |
          uv venv .venv-dev --python ${{ matrix.python-version }}
          uv pip install --python .venv-dev/bin/python -e './mlipx[dev]'
      - name: Run tests
        run: |
          uv run --python .venv-dev/bin/python pytest tests -q
