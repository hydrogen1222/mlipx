version: 2
updates:
  # Maintain dependencies for GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Python: the mlipx package itself (mlipx/pyproject.toml).
  - package-ecosystem: pip
    directory: "/mlipx"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
