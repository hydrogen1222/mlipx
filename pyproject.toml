[project]
name = "mlipx-workspace"
version = "0.1.0"
description = "Monorepo workspace for MLIP eXtended — VASP-compatible CLI/TUI/API for MLIPs"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fairchem-core",
    "fairchem-applications-adsorbml",
    "fairchem-applications-cattsunami",
    "fairchem-applications-ocx",
    "mlipx",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "mlipx",
]

# LEGACY GPU COMPATIBILITY OVERRIDE (frozen lockfile).
# The current uv.lock was generated with torch 2.6.0+cu124 for historical
# Maxwell/Pascal support.  The compatibility matrix in mlipx/install/ now
# recommends torch 2.8.0+cu126 for legacy GPUs (PyTorch 2.8+ dropped
# Maxwell/Pascal from cu128, but cu126 retains them).  Re-lock with:
#   uv lock --upgrade-package torch
# after changing this override to:
#   override-dependencies = ["torch==2.8.0+cu126", "triton==3.2.0"]
# Until then, `uv sync --frozen` continues to install the pinned 2.6.0+cu124
# for the existing UMA environment.
[tool.uv]
override-dependencies = [
    "torch==2.6.0+cu124",
    "triton==3.2.0",
]

# Optional China mirror. NOT the default so the repo installs on machines
# outside China too. China-based users can opt in with:
#   export UV_DEFAULT_INDEX=https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
fairchem-core = { workspace = true }
fairchem-data-oc = { workspace = true }
fairchem-data-odac = { workspace = true }
fairchem-data-omat = { workspace = true }
fairchem-data-omc = { workspace = true }
fairchem-data-omol = { workspace = true }
fairchem-applications-adsorbml = { workspace = true }
fairchem-applications-cattsunami = { workspace = true }
fairchem-applications-fastcsp = { workspace = true }
fairchem-applications-ocx = { workspace = true }
fairchem-demo-ocpapi = { workspace = true }
fairchem-lammps = { workspace = true }
mlipx = { workspace = true }
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
