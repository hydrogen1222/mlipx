[project]
name = "mlipx-workspace"
version = "0.1.0"
description = "Monorepo workspace for MLIP eXtended — VASP-compatible CLI/TUI/API for MLIPs"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fairchem-core",
    "fairchem-applications-adsorbml",
    "fairchem-applications-cattsunami",
    "fairchem-applications-ocx",
    "mlipx",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "mlipx",
]

# LEGACY GPU COMPATIBILITY PROFILE — not the FairChem reference environment.
# PyTorch 2.7+ removed sm_50/sm_60 from its pre-built CUDA wheels, so Pascal GPUs
# (sm_61: GTX 10xx, P104-100) have no kernel and --device cuda fails with
# "no kernel image". sm_60 kernels are binary-compatible with sm_61, so we pin
# torch 2.6.0+cu124 (which still ships sm_60) from the PyTorch cu124 index.
# This deliberately overrides fairchem-core's declared `torch~=2.8.0` pin.
# Treat the resulting environment as a compatibility compromise; use FairChem's
# declared dependencies for a reference environment. See `uv run mlipx doctor`.
[tool.uv]
override-dependencies = [
    "torch==2.6.0+cu124",
    "triton==3.2.0",
]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
fairchem-core = { workspace = true }
fairchem-data-oc = { workspace = true }
fairchem-data-odac = { workspace = true }
fairchem-data-omat = { workspace = true }
fairchem-data-omc = { workspace = true }
fairchem-data-omol = { workspace = true }
fairchem-applications-adsorbml = { workspace = true }
fairchem-applications-cattsunami = { workspace = true }
fairchem-applications-fastcsp = { workspace = true }
fairchem-applications-ocx = { workspace = true }
fairchem-demo-ocpapi = { workspace = true }
fairchem-lammps = { workspace = true }
mlipx = { workspace = true }
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
