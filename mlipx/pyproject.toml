[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipx"
version = "2.0.0"
description = "VASP-like CLI/TUI interface for MLIP models (UMA, MACE, DPA, GRACE)"
requires-python = ">=3.10, <3.13"
dependencies = [
    "ase>=3.26.0",
    "numpy",
    "packaging",
    "tqdm",
    "textual>=0.40.0",
]

[project.optional-dependencies]
# NOTE: MACE/DPA/GRACE engine backends (mace-torch, deepmd-kit,
# tensorpotential) are intentionally NOT declared as installable extras here.
# mace-torch pins e3nn==0.4.4 which conflicts with fairchem-core (e3nn>=0.5),
# so they cannot coexist in a single environment. Install the backend you
# need manually (see `mlipx doctor`), e.g.: pip install mace-torch.
uma = ["fairchem-core"]
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.7",
]
transport = [
    "kinisi>=2.0.5,<3",
]
electrolyte = [
    "gemdat>=1.7.3,<2",
]
analysis-all = [
    "scipy>=1.11",
    "matplotlib>=3.7",
    "kinisi>=2.0.5,<3",
    "gemdat>=1.7.3,<2",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
mlipx = "mlipx.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"

# GPU compatibility - run `uv run mlipx setup` (uses nvidia-smi, works
# before torch is installed) to detect your GPU and get the exact torch command.
# Support floor: Maxwell (GTX 900 series, sm_50/52). Kepler (GTX 700/600) not
# supported (no prebuilt PyTorch wheel).
#   Maxwell/Pascal/Volta (sm_50–sm_70): use the cu126 Legacy channel, e.g.
#     uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu126
#     (PyTorch 2.8+ dropped Maxwell/Pascal from cu128; 2.11+ dropped Volta)
#   Turing+ (sm_75+): use the modern channel matching the torch version,
#     e.g. torch 2.8.0 -> cu128, torch 2.12+ -> cu130.
#   The one-command installer `scripts/install_mlipx.sh` picks the right
#   channel automatically from the compatibility matrix in mlipx/install/.
